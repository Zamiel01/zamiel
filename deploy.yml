name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /var/www/portfolio/zamiel
          SOURCE: .next/

      - name: Diagnose SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          key = os.environ.get("SSH_PRIVATE_KEY", "")
          print("Key present:", bool(key))
          print("Key length:", len(key))
          print("Has OpenSSH header:", key.startswith("-----BEGIN OPENSSH PRIVATE KEY-----"))
          print("Has footer:", key.strip().endswith("-----END OPENSSH PRIVATE KEY-----"))
          print("Contains literal \\n:", "\\n" in key)
          PY

